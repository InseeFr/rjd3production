# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: R-CMD-check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      full_check:
        description: 'Execute full tests'
        required: false
        type: boolean
        default: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          FULL_CHECK: ${{ inputs.full_check || false }}
        run: |
          if [ "$FULL_CHECK" = "true" ]; then
            MATRIX='[
              {"os":"macos-latest","r":"release","java":"21"},
              {"os":"macos-latest","r":"oldrel-1","java":"21"},
              {"os":"macos-latest","r":"oldrel-2","java":"21"},
              {"os":"macos-latest","r":"4.2.0","java":"21"},

              {"os":"ubuntu-latest","r":"devel","http-user-agent":"release","java":"21"},
              {"os":"ubuntu-latest","r":"next","http-user-agent":"release","java":"21"},
              {"os":"ubuntu-latest","r":"release","java":"21"},
              {"os":"ubuntu-latest","r":"oldrel-1","java":"21"},
              {"os":"ubuntu-latest","r":"oldrel-2","java":"21"},
              {"os":"ubuntu-latest","r":"oldrel-3","java":"21"},
              {"os":"ubuntu-latest","r":"4.2.0","java":"21"},
              {"os":"ubuntu-latest","r":"release","java":"11"}
            ]'
          else
            MATRIX='[
              {"os":"macos-latest","r":"release","java":"21"},
              {"os":"ubuntu-latest","r":"release","java":"21"}
            ]'
          fi

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: setup-matrix
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, Java ${{ matrix.config.java }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.config.java }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Set up for RProtoBuf on Windows
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Set up for RProtoBuf on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Set up for RProtoBuf on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install protobuf-compiler libprotobuf-dev libprotoc-dev

      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - name: Configure C++17 for RProtoBuf
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'CXX = g++ -std=gnu++17' > "$RUNNER_TEMP/Makevars"

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          R_MAKEVARS_USER: ${{ runner.temp }}/Makevars
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"note"'
