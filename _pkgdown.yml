url: https://inseefr.github.io/rjd3production/
template:
  bootstrap: 5
  includes:
    in_header: '
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll("pre.mermaid").forEach(pre => {
    if (pre.querySelector("code")) {
      const code = pre.querySelector("code");
      pre.innerHTML = code.innerHTML;
    }
  });

  mermaid.initialize({ startOnLoad: true });
});
</script>
'
navbar:
  structure:
    left:
    - home
    - reference
    - articles
    - tutorials
    - news
    - jdemetra
    right: github
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Home
    reference:
      text: Package functions
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
      - text: Setup a production process with {rjd3production}
        href: articles/process-en.html
      - text: Mise en place d'une chaîne de production avec {rjd3production}
        href: articles/process-fr.html
      - text: Selection of calendar regressors
        href: articles/td-selection-en.html
      - text: Sélection des régresseurs de calendrier
        href: articles/td-selection-fr.html
    news:
      text: News
      href: news/index.html
    jdemetra:
      text: JDemetra+
      menu:
      - text: Download JDemetra+
        href: https://github.com/jdemetra/jdplus-main/releases
