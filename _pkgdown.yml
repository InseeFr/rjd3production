        href: https://github.com/jdemetra/jdplus-main/releases
      - text: Set up portable Java version
        href: https://doc.jdemetra.org/#Rconfig
    github:
      icon: fa-github fa-lg
      href: https://github.com/InseeFr/rjd3production
      aria-label: GitHub

reference:
- title: Initialisation
  desc: Functions to create objects with default Insee information
  contents:
  - '`init_env`'
- title: Creation
  desc: Functions to create objects with default Insee information
  contents:
  - '`create_french_calendar`'
  - '`create_insee_regressors`'
  - '`create_insee_regressors_sets`'
  - '`create_insee_context`'
  - '`create_specs_set`'
  - '`create_ws_from_data`'
- title: Comparison
  desc: Compare different Worksapces
  contents:
  - '`compare`'
  - '`run_app`'
- title: Retrieve information
  desc: Retrieve information from an entire Workspace and identify by name
  contents:
  - '`get_jsai_by_name`'
  - '`get_named_variables`'
  - '`get_series`'
- title: Modify a Workspace
  desc: Modification of a Workspace by applying a property to each SA-Processing (SAP) and SA-Items (SAI)
  contents:
  - '`add_raw_data_path`'
  - '`remove_non_significant_outliers`'
  - '`set_minimum_span`'
  - '`make_ws_crunchable`'
- title: Reverse-engineer
  desc: Turn a specification into R code and generate random specifications
  contents:
  - '`rev_spec`'
  - '`random_spec`'
- title: Global workflow
  desc: Function to retrieve regression information, apply, export and import it
  contents:
  - '`regression_tools`'
  - '`select_td`'
- title: Deprecated
  desc: Deprecated functions
  contents:
  - '`deprecated-rjd3production`'
